# Ingest GeoAI attack events, GeoIP-enrich them, and emit the CSV syslog line
# the geoip-attack-map DataServer tails (last whitespace token = 6 CSV fields:
# src_ip,dst_ip,src_port,dst_port,type_attack,cve_attack).

input {
  tcp {
    port  => 5055
    codec => json_lines
  }
}

filter {
  # sane defaults so the CSV always has 6 fields
  if ![dst_ip]      { mutate { add_field => { "dst_ip"      => "202.137.130.115" } } }
  if ![src_port]    { mutate { add_field => { "src_port"    => "0" } } }
  if ![dst_port]    { mutate { add_field => { "dst_port"    => "22" } } }
  if ![type_attack] { mutate { add_field => { "type_attack" => "CredStuffing" } } }
  if ![cve]         { mutate { add_field => { "cve"         => "CVE:0:0" } } }

  if ![service]    { mutate { add_field => { "service"     => "SSH" } } }
  if ![reputation] { mutate { add_field => { "reputation"  => "known attacker" } } }

  # GeoIP-enrich the attacker source IP (flat geoip.* incl. geoip.location geo_point)
  geoip { source => "src_ip" }
  mutate { convert => { "src_port" => "integer" "dst_port" => "integer" } }
}

output {
  # 1) feed the world attack map (DataServer tails this file)
  file {
    path  => "/shared/attack.log"
    codec => line {
      format => "geoai-sim %{src_ip},%{dst_ip},%{src_port},%{dst_port},%{type_attack},%{cve}"
    }
  }
  # 2) index into Elasticsearch for the Kibana / T-Pot-style dashboard
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "geoai-attacks-%{+YYYY.MM.dd}"
  }
  stdout { codec => dots }   # one dot per event, so `docker logs` shows throughput
}
