# GeoIP Attack Map + Logstash stack for the GeoAI FTTH platform.
# Pipeline:  GeoAI simulator --TCP/json--> Logstash --syslog line--> shared file
#            --> DataServer (GeoIP + aggregate) --Redis pub/sub--> MapServer (:8888) --> browser
name: geoai-attackmap

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"   # cap heap so it fits alongside other stacks
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./shared:/shared
    ports:
      - "127.0.0.1:5055:5055"   # simulator ships attack events here (localhost only)

  attackmap:
    build:
      context: .
      dockerfile: Dockerfile.map
    restart: unless-stopped
    depends_on: [redis]
    environment:
      REDIS_HOST: redis
      SYSLOG_PATH: /shared/attack.log
      DB_PATH: /app/repo/DataServerDB/GeoLite2-City.mmdb
      HQ_IP: "202.137.130.115"   # geolocates to Laos -> attack arcs terminate here
    volumes:
      - ./shared:/shared
    ports:
      - "8899:8888"   # world map UI (tunnel a subdomain here)

  # --- Elastic stack: T-Pot-style attack analytics ---------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # internal-only, behind the tunnel + Kibana
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      ingest.geoip.downloader.enabled: "false"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    mem_limit: 2g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"   # localhost only, for provisioning

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    restart: unless-stopped
    depends_on: [elasticsearch]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    mem_limit: 1200m
    ports:
      - "5601:5601"   # Kibana UI (tunnel a subdomain here)

volumes:
  esdata:
